[tool.black]
line-length = 88
extend-exclude = "\\.venv"

[tool.isort]
skip = [".venv"]
extend_skip = ["alembic"]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
extend-exclude = [".venv"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["E402", "I001"]
